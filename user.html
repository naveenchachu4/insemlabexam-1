<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard - Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        Task Manager
    </div>

    <div class="header-right">

        <span id="welcomeUser"></span>

        <button onclick="logout()" class="logout-btn">
            Logout
        </button>

    </div>

</header>


<main class="dashboard">

    <h1>User Dashboard</h1>


    <!-- Statistics -->

    <div class="stats">

        <div class="stat-card">
            <h3>Total Tasks</h3>
            <p id="totalTasks">0</p>
        </div>

        <div class="stat-card">
            <h3>Pending</h3>
            <p id="pendingTasks">0</p>
        </div>

        <div class="stat-card">
            <h3>In Progress</h3>
            <p id="progressTasks">0</p>
        </div>

        <div class="stat-card">
            <h3>Completed</h3>
            <p id="completedTasks">0</p>
        </div>

    </div>


    <!-- Add Task -->

    <section class="task-form-section">

        <h2>Add New Task</h2>

        <form id="taskForm">

            <input
                type="text"
                id="taskTitle"
                placeholder="Task title"
                required
            >

            <textarea
                id="taskDescription"
                placeholder="Task description"
                required
            ></textarea>

            <label>Due Date</label>

            <input
                type="date"
                id="taskDate"
                required
            >

            <label>Priority</label>

            <select id="taskPriority">

                <option value="Low">
                    Low
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="High">
                    High
                </option>

            </select>

            <button type="submit" class="btn">
                Add Task
            </button>

        </form>

    </section>


    <!-- Search and Filter -->

    <section class="task-controls">

        <input
            type="text"
            id="searchTask"
            placeholder="Search tasks..."
            onkeyup="displayTasks()"
        >

        <select
            id="filterStatus"
            onchange="displayTasks()"
        >

            <option value="All">
                All Status
            </option>

            <option value="Pending">
                Pending
            </option>

            <option value="In Progress">
                In Progress
            </option>

            <option value="Completed">
                Completed
            </option>

        </select>

        <select
            id="filterPriority"
            onchange="displayTasks()"
        >

            <option value="All">
                All Priority
            </option>

            <option value="Low">
                Low
            </option>

            <option value="Medium">
                Medium
            </option>

            <option value="High">
                High
            </option>

        </select>

    </section>


    <!-- Tasks -->

    <section>

        <h2>My Tasks</h2>

        <div id="taskList" class="task-list"></div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
